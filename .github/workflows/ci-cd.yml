name: Go CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_to_k8s:
        description: 'Deploy to Kubernetes cluster'
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.html

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/go-docker-demo
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/go-docker-demo:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/go-docker-demo:buildcache,mode=max

  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_k8s == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Identify deployment trigger
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "🚀 Automatic deployment triggered by push to main branch"
            echo "DEPLOYMENT_TYPE=automatic" >> $GITHUB_ENV
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
          else
            echo "🎯 Manual deployment triggered via workflow_dispatch"
            echo "DEPLOYMENT_TYPE=manual" >> $GITHUB_ENV
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
            echo "Target environment: ${{ github.event.inputs.environment }}"
          fi

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Update Kubernetes manifests
        run: |
          sed -i "s/<DOCKERHUB_USERNAME>/${{ secrets.DOCKERHUB_USERNAME }}/g" k8s/deployment.yaml
          sed -i "s/<DOCKERHUB_USERNAME>/${{ secrets.DOCKERHUB_USERNAME }}/g" k8s/kustomization.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/go-service --timeout=300s

      - name: Get deployment status
        run: |
          echo "Deployment Status:"
          kubectl get deployments go-service
          echo ""
          echo "Pods:"
          kubectl get pods -l app=go-service
          echo ""
          echo "Service:"
          kubectl get service go-service

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment to ${{ env.ENVIRONMENT }} completed successfully!"
          echo "Deployment type: ${{ env.DEPLOYMENT_TYPE }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to ${{ env.ENVIRONMENT }} failed!"
          echo "Deployment type: ${{ env.DEPLOYMENT_TYPE }}"
